let map, layer, chart, currentStation, currentDate;
const qs=new URLSearchParams(location.search);

function initMap(){
 map=L.map('map').setView([36.3,138.2],5);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
 layer=L.layerGroup().addTo(map); renderStations(STATIONS);
 document.getElementById('search').addEventListener('input',e=>{
   const q=e.target.value.trim().toLowerCase();
   const a=q?STATIONS.filter(s=>s.name.toLowerCase().includes(q)):STATIONS;
   renderStations(a);
   document.getElementById('status').textContent=`地点 ${a.length} 件`;
   if(a.length===1){map.setView([a[0].lat,a[0].lng],10);}
 });
}
function renderStations(a){
 layer.clearLayers();
 a.forEach(s=>L.circleMarker([s.lat,s.lng],{radius:5,weight:1,fillOpacity:.8}).addTo(layer).bindPopup(
   `<b>${s.name}</b><br><small>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</small><a href="?station=${encodeURIComponent(s.id)}">潮見表・タイドグラフ</a>`
 ));
}
function stationById(id){return STATIONS.find(s=>s.id===id)}
function showMap(){
 history.pushState({},'',location.pathname);
 document.getElementById('tide').style.display='none';
 document.getElementById('map').style.display='block';
 document.getElementById('mapHeader').style.display='flex';
 setTimeout(()=>map.invalidateSize(),10);
}
function updateUrl(){
 const u=new URL(location.href);u.search='';
 u.searchParams.set('station',currentStation.id);u.searchParams.set('date',currentDate);
 history.pushState({},'',u);
}
function openTide(id){
 currentStation=stationById(id); if(!currentStation)return;
 currentDate=qs.get('date')||new Date().toISOString().slice(0,10);
 document.getElementById('map').style.display='none';document.getElementById('mapHeader').style.display='none';document.getElementById('tide').style.display='block';
 document.getElementById('stationTitle').textContent=currentStation.name+' 潮見表・タイドグラフ';
 document.getElementById('date').value=currentDate;
 document.getElementById('date').onchange=e=>{currentDate=e.target.value;updateUrl();loadTide();};
 updateUrl();loadTide();
}
function moveDay(n){const d=new Date(currentDate+'T12:00:00');d.setDate(d.getDate()+n);currentDate=d.toISOString().slice(0,10);document.getElementById('date').value=currentDate;updateUrl();loadTide();}
function goToday(){currentDate=new Date().toISOString().slice(0,10);document.getElementById('date').value=currentDate;updateUrl();loadTide();}
async function copyUrl(){try{await navigator.clipboard.writeText(location.href);alert('URLをコピーしました。')}catch(e){prompt('コピーしてください',location.href)}}
function apiUrl(){
 // API URLを localStorage に保存。ブラウザだけで外部APIを直接呼ぶ場合、API側のCORS許可が必要。
 const el=document.getElementById('apiUrl'); if(el.value) localStorage.setItem('tideApiUrl',el.value); return el.value||localStorage.getItem('tideApiUrl')||'';
}
function normalize(raw){
 const arr=raw.data||raw.points||raw.predictions||raw.tides||raw.values||raw.result||[];
 return arr.map(x=>({time:x.time||x.datetime||x.dateTime||x.timestamp,height:Number(x.height??x.value??x.tide??x.level)})).filter(x=>Number.isFinite(x.height));
}
function extrema(a){const e=[];for(let i=1;i<a.length-1;i++){if(a[i].height>a[i-1].height&&a[i].height>a[i+1].height)e.push({type:'満潮',...a[i]});if(a[i].height<a[i-1].height&&a[i].height<a[i+1].height)e.push({type:'干潮',...a[i]})}return e;}
async function loadTide(){
 const msg=document.getElementById('message');const base=apiUrl();
 if(!base){msg.innerHTML='<b>地点は表示できます。</b><br>実際の潮汐データ取得には、CORS対応した潮汐APIのURLを右上の「潮汐API URL」に設定してください。<br>APIには緯度・経度・日付を渡す形式を想定しています。';if(chart)chart.destroy();return;}
 msg.textContent='潮汐データを取得中...';
 try{
   const u=new URL(base);u.searchParams.set('lat',currentStation.lat);u.searchParams.set('lng',currentStation.lng);u.searchParams.set('date',currentDate);
   const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const raw=await r.json();const pts=normalize(raw);
   if(!pts.length)throw new Error('レスポンスの潮位データ形式を認識できません');
   draw(pts);showEvents(extrema(pts));msg.textContent=`${currentStation.name}　${currentDate}`;
 }catch(e){msg.innerHTML='取得エラー：'+e.message+'<br><small>APIのURL、パラメータ名、CORS設定を確認してください。</small>';}
}
function draw(a){const c=document.getElementById('chart');if(chart)chart.destroy();chart=new Chart(c,{type:'line',data:{labels:a.map(p=>String(p.time).replace(/^.*T/,'').slice(0,5)),datasets:[{label:'潮位',data:a.map(p=>p.height),borderWidth:2,pointRadius:0,tension:.25}]},options:{responsive:true,scales:{x:{title:{display:true,text:'時刻'}},y:{title:{display:true,text:'潮位'}}}}});}
function showEvents(e){document.getElementById('events').innerHTML=e.map(x=>`<tr><td>${x.type}</td><td>${String(x.time).replace(/^.*T/,'').slice(0,5)}</td><td>${x.height.toFixed(1)}</td></tr>`).join('');}
initMap();
document.getElementById('apiUrl').value=localStorage.getItem('tideApiUrl')||'';
if(qs.get('station'))openTide(qs.get('station'));
</script>
</body></html>
