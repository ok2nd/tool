<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像比較ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #202020;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: #2b2b2b;
      border-bottom: 1px solid #3c3c3c;
      font-size: 14px;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    button {
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background-color: #4a4a4a;
    }
    button:active {
      background-color: #2a2a2a;
    }

    /* メイン比較ビューエリア */
    .view-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    .view-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 下部リストパネル */
    .panels {
      display: flex;
      height: 180px;
      background-color: #2b2b2b;
      border-top: 1px solid #3c3c3c;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      border-right: 1px solid #3c3c3c;
    }
    .panel:last-child {
      border-right: none;
    }
    .panel-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #cccccc;
    }
    .file-list {
      flex: 1;
      background-color: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      overflow-y: auto;
      list-style: none;
      margin-bottom: 6px;
    }
    .file-list li {
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-list li:hover {
      background-color: #2a2a2a;
    }
    .file-list li.selected {
      background-color: #094771;
      color: #ffffff;
    }
    .panel-buttons {
      display: flex;
      gap: 6px;
    }
    .panel-buttons button {
      flex: 1;
    }

    /* ステータスバー */
    .statusbar {
      padding: 4px 12px;
      background-color: #181818;
      border-top: 1px solid #282828;
      font-size: 11px;
      color: #888888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 非表示入力 element */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ツールバー -->
  <div class="toolbar">
    <div class="group">
      <label><input type="radio" name="mode" value="side" checked> 並べて表示</label>
      <label><input type="radio" name="mode" value="overlay"> 重ねて表示</label>
      <span style="border-left:1px solid #555; height:16px; margin:0 4px;"></span>
      <label><input type="radio" name="size" value="fit" checked> 縮小表示</label>
      <label><input type="radio" name="size" value="100"> 等倍表示</label>
    </div>
    <div class="group">
      <button id="btn-left-prev">◀ 左</button>
      <button id="btn-left-next">左 ▶</button>
      <span style="margin:0 4px;"></span>
      <button id="btn-both-prev">◀ 同時</button>
      <button id="btn-both-next">同時 ▶</button>
      <span style="margin:0 4px;"></span>
      <button id="btn-right-prev">◀ 右</button>
      <button id="btn-right-next">右 ▶</button>
    </div>
  </div>

  <!-- メインビュー -->
  <div class="view-container" id="view-container">
    <canvas id="canvas"></canvas>
  </div>

  <!-- 下部パネル -->
  <div class="panels">
    <div class="panel" id="panel-left">
      <div class="panel-title" id="title-left">左 (A) 0 / 0</div>
      <ul class="file-list" id="list-left"></ul>
      <div class="panel-buttons">
        <button id="btn-add-left">追加...</button>
        <button id="btn-del-left">選択を削除</button>
        <button id="btn-clr-left">全クリア</button>
      </div>
    </div>
    <div class="panel" id="panel-right">
      <div class="panel-title" id="title-right">右 (B) 0 / 0</div>
      <ul class="file-list" id="list-right"></ul>
      <div class="panel-buttons">
        <button id="btn-add-right">追加...</button>
        <button id="btn-del-right">選択を削除</button>
        <button id="btn-clr-right">全クリア</button>
      </div>
    </div>
  </div>

  <!-- ステータスバー -->
  <div class="statusbar">
    画像/フォルダを左右にドラッグ＆ドロップ | ←→:同時移動 | A/D:左 | J/L:右 | 1/2:モード | F:縮小/等倍 | ホイール:ズーム | ドラッグ:パン | ダブルクリック:リセット
  </div>

  <input type="file" id="file-input-left" multiple accept="image/*">
  <input type="file" id="file-input-right" multiple accept="image/*">

  <script>
    // 自然順ソート用比較関数
    const naturalCompare = (a, b) => {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    };

    // 画像管理モデル
    class ImageSet {
      constructor(onChange) {
        this.items = []; // { name, url, img }
        this.index = -1;
        this.onChange = onChange;
      }

      async addFiles(fileList) {
        const validExtensions = /\.(png|jpe?g|bmp|gif|webp|tiff?)$/i;
        const files = Array.from(fileList).filter(f => validExtensions.test(f.name));
        
        files.sort((a, b) => naturalCompare(a.name, b.name));

        const newItems = [];
        for (const file of files) {
          if (!this.items.some(item => item.name === file.name)) {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.src = url;
            newItems.push({ name: file.name, url, img });
          }
        }

        if (newItems.length === 0) return;

        const firstNewIndex = this.items.length;
        this.items.push(...newItems);
        if (this.index === -1) {
          this.index = 0;
        } else {
          this.index = firstNewIndex;
        }

        // 画像の読み込み完了を待って描画更新
        await Promise.all(newItems.map(item => {
          return new Promise(resolve => {
            if (item.img.complete) resolve();
            else item.img.onload = item.img.onerror = resolve;
          });
        }));

        this.onChange();
      }

      step(d) {
        if (this.items.length > 0) {
          this.setIndex(this.index + d);
        }
      }

      setIndex(i) {
        if (this.items.length === 0) return;
        const nextIdx = Math.max(0, Math.min(this.items.length - 1, i));
        if (this.index !== nextIdx) {
          this.index = nextIdx;
          this.onChange();
        }
      }

      remove(i) {
        if (i >= 0 && i < this.items.length) {
          URL.revokeObjectURL(this.items[i].url);
          this.items.splice(i, 1);
          if (this.items.length === 0) {
            this.index = -1;
          } else {
            this.index = Math.min(this.index, this.items.length - 1);
          }
          this.onChange();
        }
      }

      clear() {
        this.items.forEach(item => URL.revokeObjectURL(item.url));
        this.items = [];
        this.index = -1;
        this.onChange();
      }

      current() {
        return this.index >= 0 && this.index < this.items.length ? this.items[this.index] : null;
      }
    }

    // アプリケーション状態
    const leftSet = new ImageSet(() => updateUI());
    const rightSet = new ImageSet(() => updateUI());

    let mode = 'side'; // 'side' | 'overlay'
    let fit = true;    // true: 縮小表示 | false: 等倍表示
    let ratio = 0.5;   // 重ねて表示時の分割位置 (0.0 - 1.0)
    let zoom = 1.0;
    let pan = { x: 0, y: 0 };

    let isDragging = false;
    let dragTarget = null; // 'pan' | 'divider'
    let lastMousePos = { x: 0, y: 0 };
    let dropSideHighlight = null; // null | 'left' | 'right'

    // DOM要素
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('view-container');

    const radioModes = document.querySelectorAll('input[name="mode"]');
    const radioSizes = document.querySelectorAll('input[name="size"]');

    const listLeft = document.getElementById('list-left');
    const listRight = document.getElementById('list-right');
    const titleLeft = document.getElementById('title-left');
    const titleRight = document.getElementById('title-right');

    // リサイズ処理
    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // 描画処理
    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      if (w === 0 || h === 0) return;

      ctx.fillStyle = '#202020';
      ctx.fillRect(0, 0, w, h);

      const itemA = leftSet.current();
      const itemB = rightSet.current();

      const drawImg = (item, rect) => {
        if (!item || !item.img.complete || item.img.naturalWidth === 0) {
          ctx.fillStyle = '#909090';
          ctx.font = '14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('ここに画像をドロップ', rect.x + rect.w / 2, rect.y + rect.h / 2);
          return;
        }

        const img = item.img;
        const base = fit ? Math.min(rect.w / img.naturalWidth, rect.h / img.naturalHeight) : 1.0;
        const s = base * zoom;
        const dw = img.naturalWidth * s;
        const dh = img.naturalHeight * s;
        const cx = rect.x + rect.w / 2 + pan.x;
        const cy = rect.y + rect.h / 2 + pan.y;

        ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
      };

      const drawLabel = (text, x, y, alignRight = false) => {
        ctx.font = '12px sans-serif';
        const metrics = ctx.measureText(text);
        const tw = metrics.width + 14;
        const th = 22;
        const lx = alignRight ? x - tw : x;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.beginPath();
        ctx.roundRect(lx, y, tw, th, 4);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, lx + tw / 2, y + th / 2);
      };

      const nameA = itemA ? `A: ${itemA.name} (${leftSet.index + 1}/${leftSet.items.length})` : 'A: -';
      const nameB = itemB ? `B: ${itemB.name} (${rightSet.index + 1}/${rightSet.items.length})` : 'B: -';

      if (mode === 'side') {
        const half = w / 2;
        const rectA = { x: 0, y: 0, w: half, h: h };
        const rectB = { x: half, y: 0, w: w - half, h: h };

        // 左画像
        ctx.save();
        ctx.beginPath();
        ctx.rect(rectA.x, rectA.y, rectA.w, rectA.h);
        ctx.clip();
        drawImg(itemA, rectA);
        ctx.restore();

        // 右画像
        ctx.save();
        ctx.beginPath();
        ctx.rect(rectB.x, rectB.y, rectB.w, rectB.h);
        ctx.clip();
        drawImg(itemB, rectB);
        ctx.restore();

        // 境界線
        ctx.strokeStyle = '#5a5a5a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(half, 0);
        ctx.lineTo(half, h);
        ctx.stroke();

        drawLabel(nameA, 8, 8);
        drawLabel(nameB, half + 8, 8);
      } else {
        const full = { x: 0, y: 0, w: w, h: h };
        const x = w * ratio;

        // 左（下層・左側表示）
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, x, h);
        ctx.clip();
        drawImg(itemA, full);
        ctx.restore();

        // 右（上層・右側表示）
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, 0, w - x, h);
        ctx.clip();
        drawImg(itemB, full);
        ctx.restore();

        // 分割線とスライダー
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(x, h / 2, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#282828';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('◀▶', x, h / 2);

        drawLabel(nameA, 8, 8);
        drawLabel(nameB, w - 8, 8, true);
      }

      // ドロップのハイライト
      if (dropSideHighlight) {
        const rx = dropSideHighlight === 'left' ? 0 : w / 2;
        const rw = w / 2;
        ctx.fillStyle = 'rgba(80, 160, 255, 0.25)';
        ctx.fillRect(rx, 0, rw, h);
        ctx.strokeStyle = '#50a0ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(rx + 2, 2, rw - 4, h - 4);
      }
    }

    // UI更新関数
    function updateUI() {
      // パネルタイトルの更新
      titleLeft.textContent = `左 (A)   ${leftSet.items.length ? leftSet.index + 1 : 0} / ${leftSet.items.length}`;
      titleRight.textContent = `右 (B)   ${rightSet.items.length ? rightSet.index + 1 : 0} / ${rightSet.items.length}`;

      // リスト描画（左）
      listLeft.innerHTML = '';
      leftSet.items.forEach((item, idx) => {
        const li = document.createElement('li');
        li.textContent = item.name;
        if (idx === leftSet.index) li.classList.add('selected');
        li.addEventListener('click', () => leftSet.setIndex(idx));
        listLeft.appendChild(li);
      });

      // リスト描画（右）
      listRight.innerHTML = '';
      rightSet.items.forEach((item, idx) => {
        const li = document.createElement('li');
        li.textContent = item.name;
        if (idx === rightSet.index) li.classList.add('selected');
        li.addEventListener('click', () => rightSet.setIndex(idx));
        listRight.appendChild(li);
      });

      draw();
    }

    function resetView() {
      zoom = 1.0;
      pan = { x: 0, y: 0 };
      draw();
    }

    // マウスイベント (ズーム & パン & 分割線移動)
    function isNearDivider(x) {
      return mode === 'overlay' && Math.abs(x - canvas.width * ratio) < 14;
    }

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;

      lastMousePos = { x: e.clientX, y: e.clientY };
      isDragging = true;
      dragTarget = isNearDivider(x) ? 'divider' : 'pan';

      if (dragTarget === 'divider') {
        ratio = Math.max(0.0, Math.min(1.0, x / canvas.width));
        draw();
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;

      if (isDragging) {
        if (dragTarget === 'divider') {
          ratio = Math.max(0.0, Math.min(1.0, x / canvas.width));
          draw();
        } else if (dragTarget === 'pan') {
          pan.x += e.clientX - lastMousePos.x;
          pan.y += e.clientY - lastMousePos.y;
          lastMousePos = { x: e.clientX, y: e.clientY };
          draw();
        }
      } else {
        container.style.cursor = isNearDivider(x) ? 'ew-resize' : 'grab';
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      dragTarget = null;
      container.style.cursor = 'grab';
    });

    container.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (!isNearDivider(x)) {
        resetView();
      }
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const newZoom = Math.max(0.1, Math.min(50.0, zoom * factor));
      const actualFactor = newZoom / zoom;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const w = canvas.width;
      const h = canvas.height;

      let cx = w / 2;
      if (mode === 'side') {
        cx = mouseX < w / 2 ? w / 4 : (w * 3) / 4;
      }

      const qx = mouseX - cx;
      const qy = mouseY - h / 2;

      pan.x = qx - (qx - pan.x) * actualFactor;
      pan.y = qy - (qy - pan.y) * actualFactor;
      zoom = newZoom;

      draw();
    }, { passive: false });

    // ドラッグ＆ドロップ処理
    const handleDragOver = (e, sideTarget) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;

      if (sideTarget) {
        dropSideHighlight = sideTarget;
      } else {
        dropSideHighlight = x < canvas.width / 2 ? 'left' : 'right';
      }
      draw();
    };

    const handleDragLeave = () => {
      dropSideHighlight = null;
      draw();
    };

    container.addEventListener('dragover', (e) => handleDragOver(e, null));
    container.addEventListener('dragleave', handleDragLeave);
    container.addEventListener('drop', (e) => {
      e.preventDefault();
      const targetSide = dropSideHighlight;
      dropSideHighlight = null;
      if (e.dataTransfer.files.length > 0) {
        if (targetSide === 'left') leftSet.addFiles(e.dataTransfer.files);
        else rightSet.addFiles(e.dataTransfer.files);
      }
    });

    // パネルエリアへのドロップ
    const setupPanelDrop = (element, imageSet, sideName) => {
      element.addEventListener('dragover', (e) => handleDragOver(e, sideName));
      element.addEventListener('dragleave', handleDragLeave);
      element.addEventListener('drop', (e) => {
        e.preventDefault();
        dropSideHighlight = null;
        if (e.dataTransfer.files.length > 0) {
          imageSet.addFiles(e.dataTransfer.files);
        }
      });
    };
    setupPanelDrop(document.getElementById('panel-left'), leftSet, 'left');
    setupPanelDrop(document.getElementById('panel-right'), rightSet, 'right');

    // コントロール・ボタン操作
    radioModes.forEach(r => r.addEventListener('change', (e) => {
      mode = e.target.value;
      draw();
    }));

    radioSizes.forEach(r => r.addEventListener('change', (e) => {
      fit = e.target.value === 'fit';
      resetView();
    }));

    document.getElementById('btn-left-prev').onclick = () => leftSet.step(-1);
    document.getElementById('btn-left-next').onclick = () => leftSet.step(1);
    document.getElementById('btn-right-prev').onclick = () => rightSet.step(-1);
    document.getElementById('btn-right-next').onclick = () => rightSet.step(1);

    const stepBoth = (d) => {
      leftSet.step(d);
      rightSet.step(d);
    };
    document.getElementById('btn-both-prev').onclick = () => stepBoth(-1);
    document.getElementById('btn-both-next').onclick = () => stepBoth(1);

    // ファイル選択ダイアログ用
    const fileInputLeft = document.getElementById('file-input-left');
    const fileInputRight = document.getElementById('file-input-right');

    document.getElementById('btn-add-left').onclick = () => fileInputLeft.click();
    document.getElementById('btn-add-right').onclick = () => fileInputRight.click();

    fileInputLeft.onchange = (e) => leftSet.addFiles(e.target.files);
    fileInputRight.onchange = (e) => rightSet.addFiles(e.target.files);

    document.getElementById('btn-del-left').onclick = () => leftSet.remove(leftSet.index);
    document.getElementById('btn-del-right').onclick = () => rightSet.remove(rightSet.index);
    document.getElementById('btn-clr-left').onclick = () => leftSet.clear();
    document.getElementById('btn-clr-right').onclick = () => rightSet.clear();

    // キーボードショートカット
    window.addEventListener('keydown', (e) => {
      // フォーカスが入力領域にある場合は無効化
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      const key = e.key.toLowerCase();
      if (e.key === 'ArrowLeft') {
        stepBoth(-1);
      } else if (e.key === 'ArrowRight') {
        stepBoth(1);
      } else if (key === 'a') {
        leftSet.step(-1);
      } else if (key === 'd') {
        leftSet.step(1);
      } else if (key === 'j') {
        rightSet.step(-1);
      } else if (key === 'l') {
        rightSet.step(1);
      } else if (e.key === '1') {
        document.querySelector('input[name="mode"][value="side"]').checked = true;
        mode = 'side';
        draw();
      } else if (e.key === '2') {
        document.querySelector('input[name="mode"][value="overlay"]').checked = true;
        mode = 'overlay';
        draw();
      } else if (e.key === ' ') {
        e.preventDefault();
        mode = mode === 'side' ? 'overlay' : 'side';
        document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;
        draw();
      } else if (key === 'f') {
        fit = !fit;
        document.querySelector(`input[name="size"][value="${fit ? 'fit' : '100'}"]`).checked = true;
        resetView();
      }
    });

    // 初回初期化
    resizeCanvas();
  </script>
</body>
</html>
